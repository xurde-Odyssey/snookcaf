services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snooker
      POSTGRES_PASSWORD: snooker
      POSTGRES_DB: snooker_cafe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snooker -d snooker_cafe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
